# FeatherLite V1 - Iris/Sodium
clouds=off
oldLighting=true
underwaterOverlay=false
vignette=false
sun=true
moon=true
texture.composite.endGalaxyTex=textures/end_galaxy.png

# Group the options so Iris never has to render one enormous settings page.
# Every name below must exist exactly once in lib/settings.glsl, otherwise Iris
# throws "Range [n, -1) out of bounds" while building this screen.
#
# v6.0: END_COMPOSITE_OVERLAY is the only new option. It is listed in [END]
# because that is where it belongs logically, and its default (false) is set in
# lib/settings.glsl, not here.
screen=<profile> [SHADOWS] [AO] [LIGHTING] [MATERIAL] [SKY] [WEATHER] [WATER] [POST] [END]
screen.columns=2
screen.SHADOWS=shadowMapResolution shadowDistance SHADOW_BIAS SHADOW_STRENGTH SHADOW_TAPS SHADOW_SOFTNESS SHADOW_COLORED
screen.AO=AO_ENABLED AO_SAMPLES AO_RADIUS AO_BIAS AO_STRENGTH AO_POWER
screen.LIGHTING=SUN_STRENGTH AMBIENT_STRENGTH SHADOW_LIFT WRAP_LIGHTING TORCH_STRENGTH TORCH_FLICKER
screen.MATERIAL=BUMP_STRENGTH FACE_VARIATION SPECULAR_STRENGTH SURFACE_ROUGHNESS SKY_FRESNEL MICRO_DETAIL
screen.SKY=CLOUD_COVERAGE CLOUD_SPEED CLOUD_QUALITY CLOUD_DARKNESS CLOUD_SILVER LIGHTNING BOLT_STRENGTH
screen.WEATHER=RAIN_AMOUNT RAIN_SPEED RAIN_SLANT RAIN_RIPPLES WET_GROUND WET_DARKEN WET_GLOSS FROST_OVERLAY FROST_STRENGTH
screen.WATER=WATER_GLINT WAVE_INTENSITY WATER_ALPHA FOG_INTENSITY
screen.POST=GODRAYS GODRAYS_STRENGTH GODRAYS_SAMPLES GODRAYS_THRESHOLD BLOOM BLOOM_STRENGTH BLOOM_THRESHOLD TONEMAP_EXPOSURE SATURATION CONTRAST VIGNETTE HIGHLIGHT_WARMTH SHADOW_TINT SHADOW_TINT_AMOUNT OUTLINE_STRENGTH
screen.END=END_GALAXY_STRENGTH END_STAR_DENSITY END_NEBULA_STRENGTH END_TEXTURE_MIX END_DARKNESS END_COMPOSITE_OVERLAY

sliders=BUMP_STRENGTH FACE_VARIATION shadowMapResolution shadowDistance SHADOW_BIAS SHADOW_STRENGTH SHADOW_TAPS SHADOW_SOFTNESS AO_SAMPLES AO_RADIUS AO_BIAS AO_STRENGTH AO_POWER SUN_STRENGTH AMBIENT_STRENGTH SHADOW_LIFT WRAP_LIGHTING TORCH_STRENGTH BOLT_STRENGTH SPECULAR_STRENGTH SURFACE_ROUGHNESS SKY_FRESNEL MICRO_DETAIL CLOUD_COVERAGE CLOUD_SPEED CLOUD_DARKNESS CLOUD_SILVER RAIN_AMOUNT RAIN_SPEED RAIN_SLANT WET_DARKEN WET_GLOSS FROST_STRENGTH WAVE_INTENSITY WATER_ALPHA FOG_INTENSITY GODRAYS_STRENGTH GODRAYS_SAMPLES GODRAYS_THRESHOLD BLOOM_STRENGTH BLOOM_THRESHOLD TONEMAP_EXPOSURE SATURATION CONTRAST VIGNETTE HIGHLIGHT_WARMTH SHADOW_TINT_AMOUNT OUTLINE_STRENGTH END_GALAXY_STRENGTH END_STAR_DENSITY END_NEBULA_STRENGTH END_TEXTURE_MIX END_DARKNESS

# --- Profiles -------------------------------------------------------------
# Every profile now also sets SHADOW_COLORED, because it is the single biggest
# per-tap cost in the pack. Performance/Ultra-Lite keep it off; Quality and
# Cinematic turn it back on for the coloured glass/water shadows.
#
# The defaults in lib/settings.glsl already match the "Balanced" profile, so a
# fresh install needs no profile selection to land on the recommended setting.
profile.Ultra-Lite=shadowMapResolution=512 shadowDistance=48.0 SHADOW_BIAS=0.90 SHADOW_TAPS=4 SHADOW_SOFTNESS=1.00 SHADOW_COLORED=false AO_SAMPLES=0 GODRAYS=false GODRAYS_SAMPLES=4 GODRAYS_STRENGTH=0.025 GODRAYS_THRESHOLD=0.90 BLOOM=false CLOUD_QUALITY=1 RAIN_RIPPLES=false FROST_OVERLAY=false TONEMAP_EXPOSURE=1.00 CONTRAST=1.10 END_GALAXY_STRENGTH=0.60 END_TEXTURE_MIX=0.80 END_DARKNESS=0.94 OUTLINE_STRENGTH=0.00
profile.Performance=shadowMapResolution=512 shadowDistance=48.0 SHADOW_BIAS=0.90 SHADOW_TAPS=4 SHADOW_SOFTNESS=1.00 SHADOW_COLORED=false AO_SAMPLES=4 AO_RADIUS=0.65 AO_STRENGTH=0.45 GODRAYS_SAMPLES=4 GODRAYS_STRENGTH=0.025 GODRAYS_THRESHOLD=0.90 BLOOM_STRENGTH=0.020 CLOUD_QUALITY=1 TONEMAP_EXPOSURE=1.00 CONTRAST=1.10 END_GALAXY_STRENGTH=0.60 END_TEXTURE_MIX=0.80 END_DARKNESS=0.94 OUTLINE_STRENGTH=0.00
profile.Balanced=shadowMapResolution=1024 shadowDistance=72.0 SHADOW_BIAS=0.85 SHADOW_TAPS=8 SHADOW_SOFTNESS=1.60 SHADOW_COLORED=false AO_SAMPLES=6 AO_RADIUS=0.90 AO_STRENGTH=0.55 GODRAYS_SAMPLES=6 GODRAYS_STRENGTH=0.040 GODRAYS_THRESHOLD=0.84 BLOOM_STRENGTH=0.040 CLOUD_QUALITY=2 TONEMAP_EXPOSURE=1.00 CONTRAST=1.10 END_GALAXY_STRENGTH=0.82 END_TEXTURE_MIX=1.00 END_DARKNESS=0.88
profile.Quality=shadowMapResolution=2048 shadowDistance=96.0 SHADOW_BIAS=0.84 SHADOW_TAPS=12 SHADOW_SOFTNESS=2.00 SHADOW_COLORED=true AO_SAMPLES=12 AO_RADIUS=1.10 AO_STRENGTH=0.62 GODRAYS_SAMPLES=10 GODRAYS_STRENGTH=0.050 GODRAYS_THRESHOLD=0.82 BLOOM_STRENGTH=0.060 CLOUD_QUALITY=3 TONEMAP_EXPOSURE=0.96 CONTRAST=1.15 END_GALAXY_STRENGTH=0.86 END_TEXTURE_MIX=1.00 END_DARKNESS=0.92
profile.Cinematic=shadowMapResolution=2048 shadowDistance=128.0 SHADOW_BIAS=0.80 SHADOW_TAPS=16 SHADOW_SOFTNESS=2.60 SHADOW_COLORED=true AO_SAMPLES=16 AO_RADIUS=1.30 AO_STRENGTH=0.70 GODRAYS_SAMPLES=12 GODRAYS_STRENGTH=0.060 GODRAYS_THRESHOLD=0.80 BLOOM_STRENGTH=0.070 CLOUD_QUALITY=3 VIGNETTE=0.14 SATURATION=1.08 CONTRAST=1.20 TONEMAP_EXPOSURE=1.00 END_GALAXY_STRENGTH=0.92 END_TEXTURE_MIX=1.00 END_DARKNESS=0.90
